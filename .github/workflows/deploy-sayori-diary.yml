name: Deploy Sayori Diary

on:
  push:
    branches: [main]
    paths:
      - "posts/sayori-diary/**"
      - "friends/**"
      - "spec/sayori-friends.md"
      - "spec/sayori-friends.en.md"
      - ".github/workflows/deploy-sayori-diary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sayori-diary-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public content
        uses: actions/checkout@v6
        with:
          path: content

      - name: Checkout diary site
        uses: actions/checkout@v6
        with:
          repository: Amiyadesi/sayori-blog
          ref: main
          path: sayori-blog

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sayori-blog/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sayori-blog
        run: pnpm install --frozen-lockfile

      - name: Build isolated diary
        working-directory: sayori-blog
        env:
          CONTENT_DIR: ../content
          SITE_VARIANT: sayori-diary
          SITE_URL: https://diary.sayori.org/
        run: pnpm run build

      - name: Verify diary output
        working-directory: sayori-blog
        run: node scripts/verify-sayori-diary-build.mjs

      - name: Deploy Pages
        working-directory: sayori-blog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cp diary-worker.js dist/_worker.js
          pnpm dlx wrangler@4.111.0 pages deploy dist \
            --project-name sayori-diary \
            --branch main \
            --no-bundle \
            --commit-hash "${{ github.sha }}" \
            --commit-message "Deploy diary.sayori.org from Sayori diary content"
